name: Deploy to Azure Container Apps (Production)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        default: 'latest'

env:
  AZURE_RESOURCE_GROUP: pandiver-containerapp-rg
  AZURE_CONTAINER_ENV: pandiver-env
  ACR_NAME: pandiveracr30421

jobs:
  pre-deployment-checks:
    runs-on: ubuntu-latest
    name: Pre-deployment Validation
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

    - name: Validate Azure resources
      run: |
        # Check if Container Apps environment exists
        az containerapp env show --name ${{ env.AZURE_CONTAINER_ENV }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

        # Check if ACR exists
        az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

        echo "✅ All Azure resources validated"

  backup-production:
    runs-on: ubuntu-latest
    name: Backup Production Data
    needs: pre-deployment-checks
    environment: production

    steps:
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

    - name: Create database backup
      run: |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BACKUP_NAME="pre-deployment-backup-$TIMESTAMP"

        # Create database backup
        az sql db export \
          --server ${{ secrets.PRODUCTION_SQL_SERVER }} \
          --database ${{ secrets.PRODUCTION_DATABASE }} \
          --storage-key-type StorageAccessKey \
          --storage-key ${{ secrets.STORAGE_ACCOUNT_KEY }} \
          --storage-uri "https://${{ secrets.STORAGE_ACCOUNT }}.blob.core.windows.net/backups/${BACKUP_NAME}.bacpac" \
          --admin-user ${{ secrets.SQL_ADMIN_USER }} \
          --admin-password ${{ secrets.SQL_ADMIN_PASSWORD }}

        echo "✅ Database backup created: ${BACKUP_NAME}.bacpac"

  build-production-images:
    runs-on: ubuntu-latest
    name: Build Production Images
    needs: backup-production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

    - name: Log in to Azure Container Registry
      run: |
        az acr login --name ${{ env.ACR_NAME }}

    - name: Get version tag
      id: version
      run: |
        TAG=${{ github.event.release.tag_name || github.event.inputs.tag }}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Deploying version: $TAG"

    - name: Build and push production backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/backend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.ACR_NAME }}.azurecr.io/pandiver-backend:${{ steps.version.outputs.tag }}
          ${{ env.ACR_NAME }}.azurecr.io/pandiver-backend:production-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push production frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/frontend/Dockerfile.prod
        push: true
        tags: |
          ${{ env.ACR_NAME }}.azurecr.io/pandiver-frontend:${{ steps.version.outputs.tag }}
          ${{ env.ACR_NAME }}.azurecr.io/pandiver-frontend:production-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production Container Apps
    needs: build-production-images
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

    - name: Get ACR credentials
      id: acr-creds
      run: |
        ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query username -o tsv)
        ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query passwords[0].value -o tsv)
        echo "::add-mask::$ACR_PASSWORD"
        echo "username=$ACR_USERNAME" >> $GITHUB_OUTPUT
        echo "password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

    - name: Get version tag
      id: version
      run: |
        TAG=${{ github.event.release.tag_name || github.event.inputs.tag }}
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Get secrets from Key Vault
      id: secrets
      run: |
        SECRET_KEY=$(az keyvault secret show --vault-name ${{ secrets.KEY_VAULT_NAME }} --name secret-key --query value -o tsv)
        DATABASE_URL=$(az keyvault secret show --vault-name ${{ secrets.KEY_VAULT_NAME }} --name production-database-url --query value -o tsv)
        AZURE_TRANSLATOR_KEY=$(az keyvault secret show --vault-name ${{ secrets.KEY_VAULT_NAME }} --name azure-translator-key --query value -o tsv)
        AZURE_TRANSLATOR_REGION=$(az keyvault secret show --vault-name ${{ secrets.KEY_VAULT_NAME }} --name azure-translator-region --query value -o tsv)
        AZURE_DOC_INTELLIGENCE_KEY=$(az keyvault secret show --vault-name ${{ secrets.KEY_VAULT_NAME }} --name azure-doc-intelligence-key --query value -o tsv)
        AZURE_DOC_INTELLIGENCE_ENDPOINT=$(az keyvault secret show --vault-name ${{ secrets.KEY_VAULT_NAME }} --name azure-doc-intelligence-endpoint --query value -o tsv)

        echo "::add-mask::$SECRET_KEY"
        echo "::add-mask::$DATABASE_URL"
        echo "::add-mask::$AZURE_TRANSLATOR_KEY"
        echo "::add-mask::$AZURE_DOC_INTELLIGENCE_KEY"

        echo "secret-key=$SECRET_KEY" >> $GITHUB_OUTPUT
        echo "database-url=$DATABASE_URL" >> $GITHUB_OUTPUT
        echo "azure-translator-key=$AZURE_TRANSLATOR_KEY" >> $GITHUB_OUTPUT
        echo "azure-translator-region=$AZURE_TRANSLATOR_REGION" >> $GITHUB_OUTPUT
        echo "azure-doc-intelligence-key=$AZURE_DOC_INTELLIGENCE_KEY" >> $GITHUB_OUTPUT
        echo "azure-doc-intelligence-endpoint=$AZURE_DOC_INTELLIGENCE_ENDPOINT" >> $GITHUB_OUTPUT

    - name: Deploy Backend to Container Apps
      run: |
        # Check if backend app exists
        if az containerapp show --name pandiver-backend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "Updating existing backend container app"

          # Create new revision with blue/green deployment
          az containerapp revision copy \
            --name pandiver-backend-prod \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --from-revision $(az containerapp revision list --name pandiver-backend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)

          # Update with new image
          az containerapp update \
            --name pandiver-backend-prod \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/pandiver-backend:${{ steps.version.outputs.tag }}

        else
          echo "Creating new backend container app"
          az containerapp create \
            --name pandiver-backend-prod \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --environment ${{ env.AZURE_CONTAINER_ENV }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/pandiver-backend:${{ steps.version.outputs.tag }} \
            --registry-server ${{ env.ACR_NAME }}.azurecr.io \
            --registry-username ${{ steps.acr-creds.outputs.username }} \
            --registry-password ${{ steps.acr-creds.outputs.password }} \
            --target-port 8000 \
            --ingress internal \
            --secrets \
              secret-key="${{ steps.secrets.outputs.secret-key }}" \
              database-url="${{ steps.secrets.outputs.database-url }}" \
              azure-translator-key="${{ steps.secrets.outputs.azure-translator-key }}" \
              azure-doc-intelligence-key="${{ steps.secrets.outputs.azure-doc-intelligence-key }}" \
            --env-vars \
              SECRET_KEY=secretref:secret-key \
              DATABASE_URL=secretref:database-url \
              AZURE_TRANSLATOR_KEY=secretref:azure-translator-key \
              AZURE_TRANSLATOR_REGION="${{ steps.secrets.outputs.azure-translator-region }}" \
              AZURE_DOC_INTELLIGENCE_KEY=secretref:azure-doc-intelligence-key \
              AZURE_DOC_INTELLIGENCE_ENDPOINT="${{ steps.secrets.outputs.azure-doc-intelligence-endpoint }}" \
              ENVIRONMENT=production \
            --min-replicas 1 \
            --max-replicas 10 \
            --cpu 1.0 \
            --memory 2Gi
        fi

    - name: Get backend FQDN
      id: backend-fqdn
      run: |
        BACKEND_FQDN=$(az containerapp show --name pandiver-backend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
        echo "fqdn=$BACKEND_FQDN" >> $GITHUB_OUTPUT

    - name: Deploy Frontend to Container Apps
      run: |
        # Check if frontend app exists
        if az containerapp show --name pandiver-frontend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "Updating existing frontend container app"

          # Create new revision
          az containerapp revision copy \
            --name pandiver-frontend-prod \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --from-revision $(az containerapp revision list --name pandiver-frontend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)

          # Update with new image
          az containerapp update \
            --name pandiver-frontend-prod \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/pandiver-frontend:${{ steps.version.outputs.tag }}

        else
          echo "Creating new frontend container app"
          az containerapp create \
            --name pandiver-frontend-prod \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --environment ${{ env.AZURE_CONTAINER_ENV }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/pandiver-frontend:${{ steps.version.outputs.tag }} \
            --registry-server ${{ env.ACR_NAME }}.azurecr.io \
            --registry-username ${{ steps.acr-creds.outputs.username }} \
            --registry-password ${{ steps.acr-creds.outputs.password }} \
            --target-port 80 \
            --ingress external \
            --env-vars \
              BACKEND_URL=https://${{ steps.backend-fqdn.outputs.fqdn }} \
              ENVIRONMENT=production \
            --min-replicas 1 \
            --max-replicas 5 \
            --cpu 0.5 \
            --memory 1Gi
        fi

    - name: Wait for deployment
      run: |
        echo "Waiting for new revisions to be ready..."
        sleep 120

  post-deployment-tests:
    runs-on: ubuntu-latest
    name: Production Health Checks
    needs: deploy-production

    steps:
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

    - name: Get service URLs
      id: urls
      run: |
        BACKEND_FQDN=$(az containerapp show --name pandiver-backend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
        FRONTEND_FQDN=$(az containerapp show --name pandiver-frontend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)

        echo "backend-fqdn=$BACKEND_FQDN" >> $GITHUB_OUTPUT
        echo "frontend-fqdn=$FRONTEND_FQDN" >> $GITHUB_OUTPUT

    - name: Run production health checks
      run: |
        echo "Testing production deployment..."
        echo "Backend URL: https://${{ steps.urls.outputs.backend-fqdn }}"
        echo "Frontend URL: https://${{ steps.urls.outputs.frontend-fqdn }}"

        # Test backend health
        timeout 180 bash -c "until curl -f https://${{ steps.urls.outputs.backend-fqdn }}/; do echo 'Waiting for backend...'; sleep 10; done"

        # Test frontend
        timeout 180 bash -c "until curl -f https://${{ steps.urls.outputs.frontend-fqdn }}/; do echo 'Waiting for frontend...'; sleep 10; done"

        # Test API endpoints
        curl -f "https://${{ steps.urls.outputs.backend-fqdn }}/docs"

        echo "✅ Production health checks passed"

    - name: Traffic validation
      run: |
        # Send test requests to validate performance
        for i in {1..5}; do
          curl -f "https://${{ steps.urls.outputs.frontend-fqdn }}"
          curl -f "https://${{ steps.urls.outputs.backend-fqdn }}/health"
          sleep 2
        done
        echo "✅ Traffic validation passed"

  notify-success:
    runs-on: ubuntu-latest
    name: Notify Deployment Success
    needs: [post-deployment-tests]
    if: success()

    steps:
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

    - name: Get service URLs
      id: urls
      run: |
        FRONTEND_FQDN=$(az containerapp show --name pandiver-frontend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
        echo "frontend-fqdn=$FRONTEND_FQDN" >> $GITHUB_OUTPUT

    - name: Send success notification
      run: |
        echo "🎉 Production deployment successful!"
        echo "Version: ${{ github.event.release.tag_name || github.event.inputs.tag }}"
        echo "Production URL: https://${{ steps.urls.outputs.frontend-fqdn }}"
        echo "All health checks passed"
        echo "Production environment is ready for use"

  rollback:
    runs-on: ubuntu-latest
    name: Rollback on Failure
    needs: [post-deployment-tests]
    if: failure()
    environment: production

    steps:
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

    - name: Rollback to previous revision
      run: |
        echo "🚨 Deployment failed, rolling back..."

        # Get list of revisions and rollback to previous
        BACKEND_REVISIONS=$(az containerapp revision list --name pandiver-backend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[].name' -o tsv)
        FRONTEND_REVISIONS=$(az containerapp revision list --name pandiver-frontend-prod --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[].name' -o tsv)

        # Set traffic to previous revision (assuming 2nd in list is previous)
        BACKEND_PREV=$(echo $BACKEND_REVISIONS | cut -d' ' -f2)
        FRONTEND_PREV=$(echo $FRONTEND_REVISIONS | cut -d' ' -f2)

        if [ -n "$BACKEND_PREV" ]; then
          az containerapp ingress traffic set \
            --name pandiver-backend-prod \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight $BACKEND_PREV=100
        fi

        if [ -n "$FRONTEND_PREV" ]; then
          az containerapp ingress traffic set \
            --name pandiver-frontend-prod \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight $FRONTEND_PREV=100
        fi

        echo "✅ Rollback completed"

    - name: Notify rollback
      run: |
        echo "🚨 Production deployment failed and was rolled back"
        echo "Previous version has been restored"
        echo "Please investigate the deployment issues"