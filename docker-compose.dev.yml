services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pandiver-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pandiver
      - POSTGRES_PASSWORD=pandiver_dev_password
      - POSTGRES_DB=pandiver_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pandiver_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandiver -d pandiver_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      # Mount backend code for hot reload
      - ./backend:/app:delegated
      # Exclude Python cache and virtual environment
      - /app/__pycache__
      - /app/venv
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://pandiver:pandiver_dev_password@postgres:5432/pandiver_db
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    env_file:
      - ./environments/.env.development
    networks:
      - pandiver_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload, but preserve node_modules from image
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/next.config.js:/app/next.config.js:delegated
      - ./frontend/tsconfig.json:/app/tsconfig.json:delegated
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts:delegated
      - ./frontend/postcss.config.js:/app/postcss.config.js:delegated
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - DOCKER_ENV=true  # Flag to enable Docker-specific URL replacement
      - WATCHPACK_POLLING=true  # Enable polling for file changes in Docker
    networks:
      - pandiver_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
    name: pandiver_postgres_dev_data

networks:
  pandiver_network:
    driver: bridge